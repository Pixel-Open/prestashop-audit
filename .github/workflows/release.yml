name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_mysql, mbstring, dom, xml, xmlwriter, zip
          coverage: none
      - name: Check that the tag matches the module version
        run: grep -qF "\$this->version = '${GITHUB_REF_NAME#v}';" pixel_audit.php
      - run: composer install --working-dir=tools --no-interaction --prefer-dist
      - run: composer check --working-dir=tools
      - name: Build the archive with the commit date on every entry
        run: SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" php tools/build.php
      - name: Write the checksum
        working-directory: dist
        run: sha256sum pixel_audit.zip > pixel_audit.zip.sha256
      # Assets are attached to a draft first: an immutable release cannot receive files once published.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "${GITHUB_REF_NAME#v}" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)." \
            dist/pixel_audit.zip dist/pixel_audit.zip.sha256
          gh release edit "$GITHUB_REF_NAME" --draft=false
